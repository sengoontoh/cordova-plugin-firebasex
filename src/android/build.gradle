buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3' // Update for Cordova Android 14
        // classpath 'com.google.gms:google-services:4.4.2' // Update for Cordova Android 14
        classpath "com.google.firebase:firebase-crashlytics-gradle:2.9.9"

    }
}

repositories {
    mavenCentral()
    maven {
        url "https://maven.google.com"
    }
}

apply plugin: com.google.firebase.crashlytics.buildtools.gradle.CrashlyticsPlugin
android {
    buildTypes {
            debug {
                if (project.plugins.hasPlugin("com.google.firebase.crashlytics")) {
                    try {
                        firebaseCrashlytics {
                            mappingFileUploadEnabled false
                        }
                    } catch (ignored) {
                        logger.lifecycle("firebaseCrashlytics DSL not supported for debug, skipping…")
                    }
                }
            }
            release {
                if (project.plugins.hasPlugin("com.google.firebase.crashlytics")) {
                    try {
                        firebaseCrashlytics {
                            nativeSymbolUploadEnabled true
                            unstrippedNativeLibsDir "obj/local"
                            strippedNativeLibsDir "build/intermediates/jniLibs/release"
                        }
                    } catch (ignored) {
                        logger.lifecycle("firebaseCrashlytics DSL not supported for release, skipping…")
                    }
                }
            }
        }
}

